name: Content refresh

# Generates candidate questions from pipeline/topics.json and opens a REVIEW PULL REQUEST.
#
# It never touches the live question bank (web/src/content) and never pushes to main:
# it only pushes a new `bot/content-*` branch containing files under pipeline/candidates/.
# A human reviews that PR, and promoting a candidate into the live bank is a separate step.
#
# Manual trigger only for now. Turn the schedule on (below) once branch protection is
# enabled and you have seen one successful manual run.
on:
  workflow_dispatch:
    inputs:
      max_new:
        description: 'Most topics to send to the LLM in this run (a spending cap)'
        default: '3'
        required: false
  # schedule:
  #   - cron: '0 3 * * 1' # Mondays 03:00 UTC

# Two overlapping runs would both spend money on the same topics. Queue instead of cancel,
# so a run that is already paying for LLM calls is never killed halfway.
concurrency:
  group: content-refresh
  cancel-in-progress: false

# contents: write  -> push the bot/content-* branch
# pull-requests: write -> open the review PR
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Cost guard: candidates only reach main through a merged review PR. If an earlier bot
      # PR is still open, a new run would regenerate (and pay for) the same topics again.
      - name: Skip if a review PR is still open
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("bot/content-"))] | length')
          if [ "$open" != "0" ]; then
            echo "A bot review PR is still open ($open). Review or close it first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The web quality gate runs `node web/scripts/check-candidate.ts`, which has no npm
      # dependencies, so Node alone is enough (no `npm ci`).
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - if: steps.gate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - if: steps.gate.outputs.skip != 'true'
        name: Install dependencies
        working-directory: pipeline
        run: uv sync --locked

      # The only step that sees the OpenAI key. `run-all` exits 1 if any topic failed; we
      # record that instead of stopping, so topics that succeeded still get a review PR.
      - if: steps.gate.outputs.skip != 'true'
        name: Generate candidates
        id: generate
        working-directory: pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRILLION_OPENAI_MODEL: ${{ vars.PRILLION_OPENAI_MODEL }}
          MAX_NEW: ${{ inputs.max_new || '3' }}
        run: |
          if ! [[ "$MAX_NEW" =~ ^[0-9]+$ ]]; then
            echo "max_new must be a whole number, got: $MAX_NEW"
            exit 2
          fi
          set +e
          uv run prillion-pipeline run-all --max-new "$MAX_NEW" 2>&1 | tee "$RUNNER_TEMP/run.log"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.skip != 'true'
        name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `git status` respects .gitignore, so rejected *.failed.json files are not included.
          if [ -z "$(git status --porcelain pipeline/candidates)" ]; then
            echo "No new or changed candidates; nothing to review."
            exit 0
          fi

          branch="bot/content-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pipeline/candidates
          git commit -m "content: candidate questions (run ${GITHUB_RUN_ID})"
          git push origin "$branch"

          {
            echo "Candidate questions generated by the content pipeline. **Nothing here is live.**"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### Run summary"
            echo '```'
            sed -n '/^summary/,$p' "$RUNNER_TEMP/run.log"
            echo '```'
            echo
            echo "### Review before anything is promoted"
            echo "- [ ] Compare each file's answers with its source page (the \`documents\` in \`provenance\`)."
            echo "- [ ] Look for omissions: a missing famous answer would reject players' correct guesses."
            echo "- [ ] Check \`familiarity\` tiers; they are \`llm-estimate\`, not measured."
            echo "- [ ] Delete any candidate you do not trust before merging."
          } > "$RUNNER_TEMP/body.md"

          gh pr create --base main --head "$branch" \
            --title "content: candidate questions for review" \
            --body-file "$RUNNER_TEMP/body.md"

      # Make a partial failure visible (red run) without having blocked the PR above.
      - if: always() && steps.generate.outputs.code != '' && steps.generate.outputs.code != '0'
        name: Report failures
        run: |
          echo "run-all exited with code ${{ steps.generate.outputs.code }}; see the log above."
          exit 1
